<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flujo de misión Fase 6</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div><h1>Flujo de misión Fase 6</h1><p id="last-detail">Esperando configuración</p></div>
    <div class="status-cluster">
      <span id="connection-dot" class="status-dot"></span>
      <span id="connection-label">Conectando</span>
      <span class="metric"><b id="event-count">0</b> eventos</span>
    </div>
  </header>
  <main class="mission-workspace">
    <section class="graph-stage" aria-label="Grafo de misión">
      <div id="cy"></div>
      <div id="tooltip" role="tooltip"></div>
    </section>
    <aside class="level-panel">
      <div class="level-heading"><h2>SubROI por nivel</h2><select id="level-select" aria-label="Nivel"></select></div>
      <canvas id="level-canvas" width="520" height="420"></canvas>
      <p id="geometry-state">Esperando geometría real</p>
      <ol id="event-list"><li class="empty-state">Sin eventos</li></ol>
    </aside>
  </main>
  <script src="vendor/cytoscape.min.js"></script>
  <script src="graph_definition.js"></script>
  <script src="app.js"></script>
</body>
</html>
