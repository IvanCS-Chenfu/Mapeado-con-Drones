name: autonomous_gt_integrated_8_5_6
description: "Preparación GT lenta de D1 y D2 al fiducial seguida de autonomía integrada normal."
mission_mode: autonomous
navigation_source: gt
autonomous_handoff: true
# El bootstrap GT debe terminar aunque el mapeo continuo mantenga backpressure.
# La autonomia posterior conserva todos los vetos del task_server.
gate_mapping_backpressure: false
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_spawn_fiduciales
    type: wait_for_bool
    topic: /fiducial_spawn_ready
    expected: true
    timeout_sec: 90.0

  - name: espera_arranque_tracking
    type: wait
    seconds: 16.0

  - name: anclaje_simultaneo_en_fiducial_2
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 32.0
        ty: 32.0
        tz: 32.0
        tyaw: 16.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 180.0
      - drone_id: 2
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.3]
        yaw_deg: 90.0
        tx: 32.0
        ty: 32.0
        tz: 32.0
        tyaw: 16.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 180.0

  - name: espera_anclaje_global
    type: wait
    seconds: 12.0

  - name: separacion_gt_previa_a_autonomia
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-2.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 12.0
        ty: 12.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 120.0
      - drone_id: 2
        navigation_source: GT
        tipo_trayectoria: 0
        target: [2.0, -10.0, 1.3]
        yaw_deg: 90.0
        tx: 12.0
        ty: 12.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 120.0
