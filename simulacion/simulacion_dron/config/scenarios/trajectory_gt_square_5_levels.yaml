name: trajectory_gt_square_5_levels
description: "Cinco recorridos cuadrados GT a 1, 2, 3, 4 y 5 metros."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 180.0
steps:
  - name: espera_spawn_fiduciales
    type: wait_for_bool
    topic: /fiducial_spawn_ready
    expected: true
    timeout_sec: 90.0

  - name: espera_arranque_tracking
    type: wait
    seconds: 16.0

  - name: cinco_cuadrados_en_altura
    type: move
    mode: sequential
    goals:
      - {drone_id: 1, target: [-10.0, -10.0, 1.0], yaw_deg: 90.0, absoluto_yaw: true, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, timeout_sec: 300.0}
      - {drone_id: 1, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [10.0, -10.0, 1.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [10.0, 0.0, 1.0], yaw_deg: 90.0, absoluto_yaw: false}
      - {drone_id: 1, target: [10.0, 10.0, 1.0], yaw_deg: 0.0, absoluto_yaw: false}
      - {drone_id: 1, target: [0.0, 10.0, 1.0], yaw_deg: 90.0, absoluto_yaw: false}
      - {drone_id: 1, target: [-10.0, 10.0, 1.0], yaw_deg: -90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [-10.0, 0.0, 1.0], yaw_deg: 0.0, absoluto_yaw: true}
      - {drone_id: 1, target: [-10.0, -10.0, 1.0], yaw_deg: 0.0, absoluto_yaw: true}

      - {drone_id: 1, target: [-10.0, -10.0, 2.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [0.0, -10.0, 2.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [10.0, -10.0, 2.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [10.0, 0.0, 2.0], yaw_deg: 90.0, absoluto_yaw: false}
      - {drone_id: 1, target: [10.0, 10.0, 2.0], yaw_deg: 0.0, absoluto_yaw: false}
      - {drone_id: 1, target: [0.0, 10.0, 2.0], yaw_deg: 90.0, absoluto_yaw: false}
      - {drone_id: 1, target: [-10.0, 10.0, 2.0], yaw_deg: -90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [-10.0, 0.0, 2.0], yaw_deg: 0.0, absoluto_yaw: true}
      - {drone_id: 1, target: [-10.0, -10.0, 2.0], yaw_deg: 0.0, absoluto_yaw: true}

      - {drone_id: 1, target: [-10.0, -10.0, 3.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [0.0, -10.0, 3.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [10.0, -10.0, 3.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [10.0, 0.0, 3.0], yaw_deg: 90.0, absoluto_yaw: false}
      - {drone_id: 1, target: [10.0, 10.0, 3.0], yaw_deg: 0.0, absoluto_yaw: false}
      - {drone_id: 1, target: [0.0, 10.0, 3.0], yaw_deg: 90.0, absoluto_yaw: false}
      - {drone_id: 1, target: [-10.0, 10.0, 3.0], yaw_deg: -90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [-10.0, 0.0, 3.0], yaw_deg: 0.0, absoluto_yaw: true}
      - {drone_id: 1, target: [-10.0, -10.0, 3.0], yaw_deg: 0.0, absoluto_yaw: true}

      - {drone_id: 1, target: [-10.0, -10.0, 4.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [0.0, -10.0, 4.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [10.0, -10.0, 4.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [10.0, 0.0, 4.0], yaw_deg: 90.0, absoluto_yaw: false}
      - {drone_id: 1, target: [10.0, 10.0, 4.0], yaw_deg: 0.0, absoluto_yaw: false}
      - {drone_id: 1, target: [0.0, 10.0, 4.0], yaw_deg: 90.0, absoluto_yaw: false}
      - {drone_id: 1, target: [-10.0, 10.0, 4.0], yaw_deg: -90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [-10.0, 0.0, 4.0], yaw_deg: 0.0, absoluto_yaw: true}
      - {drone_id: 1, target: [-10.0, -10.0, 4.0], yaw_deg: 0.0, absoluto_yaw: true}

      - {drone_id: 1, target: [-10.0, -10.0, 5.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [0.0, -10.0, 5.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [10.0, -10.0, 5.0], yaw_deg: 90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [10.0, 0.0, 5.0], yaw_deg: 90.0, absoluto_yaw: false}
      - {drone_id: 1, target: [10.0, 10.0, 5.0], yaw_deg: 0.0, absoluto_yaw: false}
      - {drone_id: 1, target: [0.0, 10.0, 5.0], yaw_deg: 90.0, absoluto_yaw: false}
      - {drone_id: 1, target: [-10.0, 10.0, 5.0], yaw_deg: -90.0, absoluto_yaw: true}
      - {drone_id: 1, target: [-10.0, 0.0, 5.0], yaw_deg: 0.0, absoluto_yaw: true}
      - {drone_id: 1, target: [-10.0, -10.0, 5.0], yaw_deg: 0.0, absoluto_yaw: true}
