name: autonomous_gt_two_drones_assignment_8_2_c
mission_mode: autonomous
navigation_source: gt
trajectory_file: ../scenarios/autonomous_gt_two_drones_assignment_8_2_c.yaml
name: autonomous_gt_two_drones_assignment_8_2_c
description: "Dos drones GT se anclan en fiducial 2 y se separan para la asignacion multidron."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_spawn_fiduciales
    type: wait_for_bool
    topic: /fiducial_spawn_ready
    expected: true
    timeout_sec: 90.0

  - name: espera_arranque_tracking
    type: wait
    seconds: 16.0

  - name: anclaje_simultaneo_en_fiducial_2
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 16.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 180.0
      - drone_id: 2
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.3]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 16.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 180.0

  - name: espera_anclaje_global
    type: wait
    seconds: 12.0

  - name: separacion_suave_para_asignacion
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-2.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 12.0
        ty: 12.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 120.0
      - drone_id: 2
        navigation_source: GT
        tipo_trayectoria: 0
        target: [2.0, -10.0, 1.3]
        yaw_deg: 90.0
        tx: 12.0
        ty: 12.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 120.0
