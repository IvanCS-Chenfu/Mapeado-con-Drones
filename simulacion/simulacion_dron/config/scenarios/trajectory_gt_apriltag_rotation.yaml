name: trajectory_gt_apriltag_rotation
description: "Un dron GT para medir error AprilTag durante giro horario gradual."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_spawn_fiduciales
    type: wait_for_bool
    topic: /fiducial_spawn_ready
    expected: true
    timeout_sec: 90.0

  - name: espera_arranque_tracking
    type: wait
    seconds: 16.0

  - name: aproximacion_fiducial_2
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 16.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 180.0

  - name: espera_observacion_inicial
    type: wait
    seconds: 8.0

  - name: giro_horario_30_grados_1
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-0.5, -10.0, 1.0]
        yaw_deg: -30.0
        tx: 15.0
        ty: 15.0
        tz: 15.0
        tyaw: 15.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: false
        timeout_sec: 180.0

  - name: giro_horario_30_grados_2
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-1.0, -10.0, 1.0]
        yaw_deg: -30.0
        tx: 15.0
        ty: 15.0
        tz: 15.0
        tyaw: 15.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: false
        timeout_sec: 180.0

  - name: giro_horario_30_grados_3
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-1.5, -10.0, 1.0]
        yaw_deg: -30.0
        tx: 15.0
        ty: 15.0
        tz: 15.0
        tyaw: 15.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: false
        timeout_sec: 180.0

  - name: espera_observacion_final
    type: wait
    seconds: 10.0
