name: f5h_322_diagnostico_vhat_orb_shadow
description: "F5H 322: autoridad GT estable y cadena ORB dinamica completa en shadow."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 120.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: espera_tracking, type: wait, seconds: 16.0}
  - {name: llegada_gt_fiducial_2, type: move, mode: sequential, goals: [{drone_id: 1, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 8.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}]}
  - {name: espera_anchor_y_settled, type: wait, seconds: 12.0}
  - {name: hover_gt_con_orb_shadow, type: wait, seconds: 30.0}
