name: fase_1j_regresion_vuelo_pitch_activo_neutral
description: "Vuelo GT_FORCED con gate real de llegada y joint pitch activo en neutral."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 120.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: llegada_gt, type: move, mode: sequential, goals: [{drone_id: 1, navigation_source: GT, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 8.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}]}
  - {name: valida_llegada_real, type: wait_for_navigation_pose, drone_id: 1, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, position_tolerance_m: 0.10, yaw_tolerance_deg: 2.0, hold_sec: 1.0, timeout_sec: 12.0}
  - {name: observacion_final, type: wait, seconds: 3.0}
