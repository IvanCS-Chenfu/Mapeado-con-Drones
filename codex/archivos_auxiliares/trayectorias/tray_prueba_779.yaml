name: fase_6_view_advance_fallback_d1_gt_depth
description: >-
  Repite el anclaje GT de D1 en fiducial 2 y valida que toda aproximacion FREE
  de respaldo antes de UNKNOWN se completa con captura depth y materializacion.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 600.0
steps:
  - name: espera_registro_y_mapa
    type: wait
    seconds: 22.0
  - name: anclaje_fiducial_2_d1_gt_yaw_90
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: habilita_autonomia_u_tras_anclaje
    type: call_set_bool
    service: /mission/set_coverage_execution_enabled
    value: true
    timeout_sec: 20.0
  - name: observacion_autonoma_u_con_depth
    type: wait
    seconds: 180.0
