name: fase_1j_handoff_orb_barrido_pitch_limites
description: "Llegada con GT_FORCED, herencia ORB global con fallback y barrido de pitch entre limites."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 120.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: llegada_gt_fiducial_2, type: move, mode: sequential, goals: [{drone_id: 1, navigation_source: GT, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 8.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}]}
  - {name: valida_llegada_real, type: wait_for_navigation_pose, drone_id: 1, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, position_tolerance_m: 0.10, yaw_tolerance_deg: 2.0, hold_sec: 1.0, timeout_sec: 12.0}
  - {name: espera_anchor_y_cualificacion, type: wait, seconds: 8.0}
  - {name: goal_hover_hereda_orb_global, type: move, mode: sequential, goals: [{drone_id: 1, navigation_source: None, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 4.0, ty: 4.0, tz: 4.0, tyaw: 4.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}]}
  - {name: pitch_abajo_70, type: pitch, drone_id: 1, target_deg: 70.0, tolerance_deg: 1.0, timeout_sec: 25.0}
  - {name: observa_pitch_abajo, type: wait, seconds: 5.0}
  - {name: pitch_arriba_70, type: pitch, drone_id: 1, target_deg: -70.0, tolerance_deg: 1.0, timeout_sec: 25.0}
  - {name: observa_pitch_arriba, type: wait, seconds: 5.0}
  - {name: pitch_abajo_70_retorno, type: pitch, drone_id: 1, target_deg: 70.0, tolerance_deg: 1.0, timeout_sec: 25.0}
  - {name: observacion_final_orb, type: wait, seconds: 15.0}
