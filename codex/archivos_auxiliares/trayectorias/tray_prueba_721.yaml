name: fase_6L_riesgo_visual_vertical_local_gt_d1_repeticion_limpia
description: "Repeticion limpia de la prueba vertical de D1/GT: llega al fiducial 2 y encadena metas D* relativas de +2 m en Z hasta TRACKING_RISK y reorientacion local yaw/pitch."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 300.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: espera_registro, type: wait, seconds: 22.0}
  - name: anclaje_gt_fiducial_2_d1
    type: move
    mode: sequential
    goals:
      - {drone_id: 1, navigation_source: GT, retry_on_rejected: true, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 16.0, ty: 16.0, tz: 12.0, tyaw: 6.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - {name: confirma_llegada_fiducial_2, type: wait_for_navigation_pose, drone_id: 1, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, position_tolerance_m: 0.15, yaw_tolerance_deg: 3.0, hold_sec: 1.0, timeout_sec: 24.0}
  - {name: espera_anclaje, type: wait, seconds: 12.0}
  - {name: ascenso_z_relativo_hasta_reorientacion_local, type: plan_route_relative_until_visual_risk, drone_id: 1, task_id: map_section_level_0_AB, offset_world: [0.0, 0.0, 2.0], max_steps: 30, dispatch_execution: true, timeout_sec: 25.0, terminal_timeout_sec: 120.0}
