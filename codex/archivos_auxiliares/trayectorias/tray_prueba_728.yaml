name: fase_6N_coverage_normal_d1_gt_depth
description: >-
  Prueba limpia: D1 llega con GT al fiducial 2 y el servidor ejecuta coverage
  hacia voxeles UNKNOWN mientras se publican e integran observaciones depth por
  KeyFrame como evidencia reversible FREE/OCCUPIED.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_registro_y_mapa
    type: wait
    seconds: 22.0
  - name: anclaje_fiducial_2_d1_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: espera_anclaje_y_coverage_depth
    type: wait
    seconds: 140.0
