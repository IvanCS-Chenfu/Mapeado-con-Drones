name: fase_6N_free_sparse_ransac_y_depth_lejano_d1
description: >-
  Lleva solo D1 con GT al fiducial 2; habilita la inspeccion y depth para
  comprobar las fuentes FREE por KeyFrame RANSAC, los rayos depth lejanos y
  unos pasos D* visibles sin forzar una optimizacion fiducial.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 420.0
steps:
  - name: espera_registro_y_mapa
    type: wait
    seconds: 22.0
  - name: anclaje_fiducial_2_d1_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: observacion_inspeccion_depth_y_pasos_dstar
    type: wait
    seconds: 150.0
