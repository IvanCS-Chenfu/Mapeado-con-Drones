name: fase_6H_6I_pref_wall_4m_observacion_prolongada_d1
description: >-
  D1 llega con GT al fiducial 2 y mantiene la autonomia 6H/6I sin limite
  practico de observacion. La preferencia de distancia a la pared es 4 m.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 90000.0
steps:
  - name: espera_registro_y_mapa
    type: wait
    seconds: 22.0
  - name: anclaje_fiducial_2_d1_gt_yaw_90
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: habilita_autonomia_6h_6i_tras_anclaje
    type: call_set_bool
    service: /mission/set_coverage_execution_enabled
    value: true
    timeout_sec: 20.0
  - name: observacion_autonoma_sin_limite_practico
    type: wait
    seconds: 86400.0
