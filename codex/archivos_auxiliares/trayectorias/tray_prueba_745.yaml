name: fase_6_barrido_fachada_fallback_depth_atomico
description: >-
  D1 llega con GT al fiducial 2 y ejecuta la inspeccion automatica con giro
  limitado a 5 grados/s. Valida la seleccion newest-first entre los tres
  ultimos frames con al menos 20 inliers, la recepcion atomica de ambas
  observaciones depth y el avance por el prefijo FREE conectado.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 600.0
steps:
  - name: espera_registro_y_mapa
    type: wait
    seconds: 22.0
  - name: anclaje_fiducial_2_d1_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: observacion_barrido_fachada_d1
    type: wait
    seconds: 240.0
