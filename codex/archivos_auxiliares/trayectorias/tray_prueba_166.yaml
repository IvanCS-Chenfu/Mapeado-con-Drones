name: prueba_3q_retry_fiducial_y_continuidad
description: "Reproduce el tramo fiducial 2 -> fiducial 1 y verifica que un commit stale no bloquee el siguiente goal."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_arranque_tracking
    type: wait
    seconds: 16.0

  - name: ambos_al_fiducial_2
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [0.0, -9.0, 1.0]
        yaw_deg: 90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
      - drone_id: 2
        tipo_trayectoria: 0
        target: [0.0, -9.0, 1.3]
        yaw_deg: 90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true

  - name: espera_anclaje_fiducial_2
    type: wait
    seconds: 8.0

  - name: ambos_a_esquinas_sur_opuestas
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-10.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
      - drone_id: 2
        tipo_trayectoria: 0
        target: [10.0, -10.0, 1.3]
        yaw_deg: 90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true

  - name: ambos_a_esquinas_norte_opuestas
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-10.0, 10.0, 1.0]
        yaw_deg: 0.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
      - drone_id: 2
        tipo_trayectoria: 0
        target: [10.0, 10.0, 1.3]
        yaw_deg: 180.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true

  - name: ambos_al_fiducial_1
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [0.0, 9.0, 1.0]
        yaw_deg: -90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
      - drone_id: 2
        tipo_trayectoria: 0
        target: [0.0, 9.0, 1.3]
        yaw_deg: -90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true

  - name: espera_optimizacion_fiducial_1
    type: wait
    seconds: 12.0

  - name: movimiento_posterior_al_retry
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-1.0, 9.0, 1.0]
        yaw_deg: -90.0
        tx: 8.0
        ty: 8.0
        tz: 8.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 120.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [1.0, 9.0, 1.3]
        yaw_deg: -90.0
        tx: 8.0
        ty: 8.0
        tz: 8.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 120.0

  - name: espera_drenaje
    type: wait
    seconds: 20.0
