name: prueba_154_anclaje_loop_sin_fiducial
description: "Dron 1 ancla por fiducial y cartografia la fachada oeste; dron 2 evita ambos fiduciales y se ancla al repetir esa zona mediante loop."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_arranque_tracking
    type: wait
    seconds: 16.0

  - name: dron_1_al_fiducial_sur
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [0.0, -9.0, 1.0]
        yaw_deg: 90.0
        tx: 35.0
        ty: 35.0
        tz: 35.0
        tyaw: 10.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: espera_anclaje_fiducial
    type: wait
    seconds: 8.0

  - name: dron_1_esquina_suroeste
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-9.0, -9.0, 1.0]
        yaw_deg: 90.0
        tx: 32.0
        ty: 32.0
        tz: 32.0
        tyaw: 10.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: dron_1_fachada_oeste_centro
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-9.0, 0.0, 1.0]
        yaw_deg: 0.0
        tx: 32.0
        ty: 32.0
        tz: 32.0
        tyaw: 10.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: dron_1_esquina_noroeste
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-9.0, 9.0, 1.0]
        yaw_deg: 0.0
        tx: 32.0
        ty: 32.0
        tz: 32.0
        tyaw: 10.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: dron_1_se_aparta_de_la_ruta
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-6.0, 9.0, 1.0]
        yaw_deg: 0.0
        tx: 20.0
        ty: 20.0
        tz: 20.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: espera_mapa_y_bases_dron_1
    type: wait
    seconds: 15.0

  - name: dron_2_esquina_suroeste_sin_fiducial
    type: move
    mode: sequential
    goals:
      - drone_id: 2
        tipo_trayectoria: 0
        target: [-9.0, -9.0, 1.3]
        yaw_deg: 90.0
        tx: 24.0
        ty: 24.0
        tz: 24.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: dron_2_fachada_oeste_sur
    type: move
    mode: sequential
    goals:
      - drone_id: 2
        tipo_trayectoria: 0
        target: [-9.0, -3.0, 1.3]
        yaw_deg: 0.0
        tx: 26.0
        ty: 26.0
        tz: 26.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: espera_primera_hipotesis_loop
    type: wait
    seconds: 5.0

  - name: dron_2_fachada_oeste_norte
    type: move
    mode: sequential
    goals:
      - drone_id: 2
        tipo_trayectoria: 0
        target: [-9.0, 3.0, 1.3]
        yaw_deg: 0.0
        tx: 26.0
        ty: 26.0
        tz: 26.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: dron_2_esquina_noroeste
    type: move
    mode: sequential
    goals:
      - drone_id: 2
        tipo_trayectoria: 0
        target: [-9.0, 9.0, 1.3]
        yaw_deg: 0.0
        tx: 26.0
        ty: 26.0
        tz: 26.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: espera_anclaje_loop_y_drenaje
    type: wait
    seconds: 60.0
