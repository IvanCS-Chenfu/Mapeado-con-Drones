name: fase_6_depth_frames_frescos_sin_repeticion
description: >-
  Lleva D1 con GT al fiducial 2 y deja actuar el barrido automatico para validar
  candidatos depth de frames intermedios, soporte absoluto, consumo sin
  repeticion y avance por evidencia nueva o prefijo FREE conocido.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 600.0
steps:
  - name: espera_registro_y_mapa
    type: wait
    seconds: 22.0
  - name: anclaje_fiducial_2_d1_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: observacion_depth_y_barrido_d1
    type: wait
    seconds: 240.0
