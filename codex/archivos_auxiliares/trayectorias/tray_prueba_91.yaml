name: prueba_91_anclaje_fiducial_3e_live
description: "Ambos drones llegan al fiducial 2, crean anchors y permanecen para observacion web/RViz2."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 240.0
steps:
  - name: espera_arranque_tracking
    type: wait
    seconds: 14.0

  - name: ambos_drones_al_fiducial_2
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [0.0, -9.0, 1.0]
        yaw_deg: 90.0
        tx: 22.0
        ty: 22.0
        tz: 22.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
      - drone_id: 2
        tipo_trayectoria: 0
        target: [0.0, -9.0, 1.3]
        yaw_deg: 90.0
        tx: 22.0
        ty: 22.0
        tz: 22.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true

  - name: permanencia_para_anclaje_y_observacion
    type: wait
    seconds: 35.0
