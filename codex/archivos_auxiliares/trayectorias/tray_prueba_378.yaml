name: fase_7_bloque_2_ruta_corta_revision_manual
description: "Ruta corta de dos drones para sparse, KFs, fiduciales y picking GUI."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 180.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: espera_tracking, type: wait, seconds: 16.0}
  - name: observar_fiducial_sur
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, navigation_source: GT, tipo_trayectoria: 0, target: [-2.0, -10.0, 1.0], yaw_deg: 90.0, tx: 18.0, ty: 18.0, tz: 18.0, tyaw: 8.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
      - {drone_id: 2, navigation_source: GT, tipo_trayectoria: 0, target: [2.0, -10.0, 1.3], yaw_deg: 90.0, tx: 18.0, ty: 18.0, tz: 18.0, tyaw: 8.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - {name: integrar_sur, type: wait, seconds: 8.0}
  - name: cruzar_por_laterales
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, navigation_source: GT, tipo_trayectoria: 0, target: [-7.0, 0.0, 1.0], yaw_deg: 0.0, tx: 25.0, ty: 25.0, tz: 25.0, tyaw: 10.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
      - {drone_id: 2, navigation_source: GT, tipo_trayectoria: 0, target: [7.0, 0.0, 1.3], yaw_deg: 180.0, tx: 25.0, ty: 25.0, tz: 25.0, tyaw: 10.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - name: observar_fiducial_norte
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, navigation_source: GT, tipo_trayectoria: 0, target: [-2.0, 10.0, 1.0], yaw_deg: -90.0, tx: 25.0, ty: 25.0, tz: 25.0, tyaw: 10.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
      - {drone_id: 2, navigation_source: GT, tipo_trayectoria: 0, target: [2.0, 10.0, 1.3], yaw_deg: -90.0, tx: 25.0, ty: 25.0, tz: 25.0, tyaw: 10.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - {name: integrar_norte, type: wait, seconds: 10.0}
  - {name: revision_manual_gui, type: wait_for_bool, topic: /codex/f7_manual_review_done, expected: true, timeout_sec: 1800.0}
  - {name: cierre_observacion, type: wait, seconds: 3.0}
