name: fase_6_barrido_fachada_d1_gt_worker_aislado
description: >-
  D1 llega con GT al fiducial 2 y queda a disposicion del planificador
  automatico de fachada; el periodo del worker se amplia solo en el launch de
  prueba para evitar que InspectFacade sustituya el goal externo al final.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 900.0
steps:
  - name: espera_registro_y_mapa
    type: wait
    seconds: 22.0
  - name: anclaje_fiducial_2_d1_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: observacion_barrido_fachada_d1
    type: wait
    seconds: 360.0
