name: fase_6I_free_reversible_y_escape_dstar_sin_ruido
description: "GT acerca ambos drones al fiducial 2 para validar FREE reversible y solicitar D* a (-9,-4,Z)."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 240.0}
steps:
  - {name: espera_estabilizacion, type: wait, seconds: 20.0}
  - name: aproximacion_fiducial_2_gt
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, navigation_source: GT, tipo_trayectoria: 0, target: [-0.5, -10.0, 1.0], yaw_deg: 90.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 6.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
      - {drone_id: 2, navigation_source: GT, tipo_trayectoria: 0, target: [0.5, -10.0, 1.3], yaw_deg: 90.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 6.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - {name: observacion_fiducial_y_materializacion_free_voxel, type: wait, seconds: 50.0}
  - {name: ventana_solicitudes_dstar_escape, type: wait, seconds: 150.0}
