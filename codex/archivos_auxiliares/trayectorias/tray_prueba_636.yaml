name: fase_6H_anclaje_fiducial_2_y_candidato_dstar
description: "Ambos drones alcanzan primero el fiducial 2 en (0, -10, Z), esperan el anclaje y se desplazan brevemente a su alrededor para producir coverage y la ruta D* automatica, sin ejecutarla."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 240.0}
steps:
  - {name: espera_registro_y_tareas, type: wait, seconds: 22.0}
  - name: anclaje_fiducial_2
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, navigation_source: GT, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 16.0, ty: 16.0, tz: 12.0, tyaw: 6.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
      - {drone_id: 2, navigation_source: GT, tipo_trayectoria: 0, target: [0.0, -10.0, 1.3], yaw_deg: 90.0, tx: 16.0, ty: 16.0, tz: 12.0, tyaw: 6.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - {name: espera_anclaje_y_voxeles, type: wait, seconds: 35.0}
  - name: movimiento_corto_alrededor_fiducial_2
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, navigation_source: GT, tipo_trayectoria: 0, target: [-0.5, -9.5, 1.0], yaw_deg: 90.0, tx: 8.0, ty: 8.0, tz: 8.0, tyaw: 4.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
      - {drone_id: 2, navigation_source: GT, tipo_trayectoria: 0, target: [0.5, -9.5, 1.3], yaw_deg: 90.0, tx: 8.0, ty: 8.0, tz: 8.0, tyaw: 4.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - {name: observacion_coverage_y_ruta_prevista, type: wait, seconds: 50.0}
