name: f5c_f5f_rodeo_relativo_dos_drones
description: "F5C-F: rodeo largo relativo con dos drones, dos fiduciales y metricas O/W/GT."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_spawn_fiduciales
    type: wait_for_bool
    topic: /fiducial_spawn_ready
    expected: true
    timeout_sec: 90.0

  - name: espera_arranque_tracking
    type: wait
    seconds: 20.0

  - name: ambos_al_fiducial_2_relativo
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [0.8, 0.0, 0.85], yaw_deg: 0.0,
         tx: 12.0, ty: 12.0, tz: 20.0, tyaw: 4.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}
      - {drone_id: 2, tipo_trayectoria: 0, target: [0.8, 0.0, 1.15], yaw_deg: 0.0,
         tx: 12.0, ty: 12.0, tz: 20.0, tyaw: 4.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}

  - name: espera_anclaje_fiducial_2
    type: wait
    seconds: 12.0

  - name: ambos_a_esquinas_sur
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [-9.8, 0.0, 0.0], yaw_deg: 0.0,
         tx: 40.0, ty: 40.0, tz: 8.0, tyaw: 8.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}
      - {drone_id: 2, tipo_trayectoria: 0, target: [8.2, 0.0, 0.0], yaw_deg: 0.0,
         tx: 40.0, ty: 40.0, tz: 8.0, tyaw: 8.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}

  - name: ambos_a_esquinas_norte
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [0.0, 20.0, 0.0], yaw_deg: -90.0,
         tx: 60.0, ty: 60.0, tz: 8.0, tyaw: 13.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}
      - {drone_id: 2, tipo_trayectoria: 0, target: [0.0, 20.0, 0.0], yaw_deg: 90.0,
         tx: 60.0, ty: 60.0, tz: 8.0, tyaw: 13.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}

  - name: ambos_al_fiducial_1
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [10.0, 0.0, 0.0], yaw_deg: -90.0,
         tx: 40.0, ty: 40.0, tz: 8.0, tyaw: 13.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}
      - {drone_id: 2, tipo_trayectoria: 0, target: [-10.0, 0.0, 0.0], yaw_deg: 90.0,
         tx: 40.0, ty: 40.0, tz: 8.0, tyaw: 13.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}

  - name: espera_anclaje_fiducial_1
    type: wait
    seconds: 12.0

  - name: ambos_cruzan_norte
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [10.0, 0.0, 0.0], yaw_deg: 0.0,
         tx: 40.0, ty: 40.0, tz: 8.0, tyaw: 8.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}
      - {drone_id: 2, tipo_trayectoria: 0, target: [-10.0, 0.0, 0.0], yaw_deg: 0.0,
         tx: 40.0, ty: 40.0, tz: 8.0, tyaw: 8.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}

  - name: ambos_bajan_a_esquinas_sur
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [0.0, -20.0, 0.0], yaw_deg: -90.0,
         tx: 60.0, ty: 60.0, tz: 8.0, tyaw: 13.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}
      - {drone_id: 2, tipo_trayectoria: 0, target: [0.0, -20.0, 0.0], yaw_deg: 90.0,
         tx: 60.0, ty: 60.0, tz: 8.0, tyaw: 13.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}

  - name: ambos_vuelven_al_fiducial_2
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [-10.0, 0.0, 0.0], yaw_deg: -90.0,
         tx: 40.0, ty: 40.0, tz: 8.0, tyaw: 13.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}
      - {drone_id: 2, tipo_trayectoria: 0, target: [10.0, 0.0, 0.0], yaw_deg: 90.0,
         tx: 40.0, ty: 40.0, tz: 8.0, tyaw: 13.0,
         absoluto_x: false, absoluto_y: false, absoluto_z: false, absoluto_yaw: false}

  - name: espera_revision_y_reporte_final
    type: wait
    seconds: 20.0
