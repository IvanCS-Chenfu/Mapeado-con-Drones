name: fase_6I_diagnostico_dstar_estricto_d1
description: >-
  D1 llega con GT al fiducial 2 y deja que el flujo autonomo 6H/6I genere
  planificaciones estrictas. El parametro de depuracion de D* clasifica el
  bloqueo entre ocupacion real, inflacion, reservas y UNKNOWN. D2 no se lanza.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 420.0
steps:
  - name: espera_registro_y_mapa
    type: wait
    seconds: 22.0
  - name: anclaje_fiducial_2_d1_gt_yaw_90
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: diagnostico_dstar_estricto_d1
    type: wait
    seconds: 90.0
