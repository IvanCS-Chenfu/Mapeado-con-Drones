name: fase_3R_score_mappoints_aislados_gui
description: >-
  D1 con GT al fiducial 2 para inspeccionar en GUI F7 los MapPoints publicados
  por Fase 3: los aislados tras tres observaciones deben conservarse visibles
  con score cero.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 180.0
steps:
  - name: espera_registro
    type: wait
    seconds: 2.0
  - name: anclaje_fiducial_2_d1_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 10.0
        ty: 10.0
        tz: 8.0
        tyaw: 5.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: observacion_scores_aislados
    type: wait
    seconds: 90.0
