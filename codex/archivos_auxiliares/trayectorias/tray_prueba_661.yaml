name: fase_6H_6I_dstar_coverage_d2_gt_prolongada
description: "D2 se ancla con GT al fiducial 2. La exploracion automatica de D2 debe aceptar una ruta D* segura, ejecutar la trayectoria completa y producir nueva evidencia de coverage."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 335.0}
steps:
  - {name: espera_registro_y_tareas, type: wait, seconds: 22.0}
  - name: anclaje_fiducial_2_d2
    type: move
    mode: sequential
    goals:
      - {drone_id: 2, navigation_source: GT, tipo_trayectoria: 0, target: [0.0, -10.0, 1.3], yaw_deg: 90.0, tx: 16.0, ty: 16.0, tz: 12.0, tyaw: 6.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - {name: habilitar_exploracion_automatica_d2, type: call_set_bool, service: /mission/set_coverage_execution_enabled, value: true, timeout_sec: 20.0}
  - {name: observar_plan_dstar_ejecucion_y_coverage_d2, type: wait, seconds: 220.0}
