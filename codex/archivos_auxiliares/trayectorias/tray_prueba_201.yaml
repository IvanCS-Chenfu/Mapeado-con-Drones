name: fase4_ab_objetos_fiduciales_trayectoria_segura
description: "Dos drones recorren el cuadrado +-10 tras confirmar el spawn de tres objetos fiduciales a +-8.5."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_spawn_fiduciales
    type: wait_for_bool
    topic: /fiducial_spawn_ready
    expected: true
    timeout_sec: 90.0

  - name: espera_arranque_tracking
    type: wait
    seconds: 16.0

  - name: esquinas_iniciales_opuestas
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [-10.0, -10.0, 1.0], yaw_deg: 90.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, timeout_sec: 300.0}
      - {drone_id: 2, tipo_trayectoria: 0, target: [10.0, 10.0, 1.3], yaw_deg: -90.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, timeout_sec: 300.0}

  - name: laterales_verticales
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [-10.0, 10.0, 1.0], yaw_deg: 0.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, timeout_sec: 300.0}
      - {drone_id: 2, tipo_trayectoria: 0, target: [10.0, -10.0, 1.3], yaw_deg: 180.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, timeout_sec: 300.0}

  - name: cruces_norte_sur_separados
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [10.0, 10.0, 1.0], yaw_deg: -90.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, timeout_sec: 300.0}
      - {drone_id: 2, tipo_trayectoria: 0, target: [-10.0, -10.0, 1.3], yaw_deg: 90.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, timeout_sec: 300.0}

  - name: segundos_laterales_verticales
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [10.0, -10.0, 1.0], yaw_deg: 180.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, timeout_sec: 300.0}
      - {drone_id: 2, tipo_trayectoria: 0, target: [-10.0, 10.0, 1.3], yaw_deg: 0.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, timeout_sec: 300.0}

  - name: cierre_cuadrado
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [-10.0, -10.0, 1.0], yaw_deg: 90.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, timeout_sec: 300.0}
      - {drone_id: 2, tipo_trayectoria: 0, target: [10.0, 10.0, 1.3], yaw_deg: -90.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, timeout_sec: 300.0}

  - name: observacion_visual_final
    type: wait
    seconds: 30.0
