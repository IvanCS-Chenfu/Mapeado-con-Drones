name: prueba_tipica_anclaje_diferencial
description: "Prueba tipica: dos drones visitan el fiducial 2, se desplazan a la izquierda y vuelven para provocar revisit fiducial."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 240.0
steps:
  - name: espera_arranque_tracking
    type: wait
    seconds: 14.0

  - name: dron_1_al_fiducial_2
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [0.0, -9.0, 1.0]
        yaw_deg: 90.0
        tx: 22.0
        ty: 22.0
        tz: 22.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: dron_2_al_fiducial_2
    type: move
    mode: sequential
    goals:
      - drone_id: 2
        tipo_trayectoria: 0
        target: [0.0, -9.0, 1.3]
        yaw_deg: 90.0
        tx: 22.0
        ty: 22.0
        tz: 22.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: espera_publicacion_inicial
    type: wait
    seconds: 6.0

  - name: dron_1_a_x_menos_8
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-8.0, -9.0, 1.0]
        yaw_deg: 90.0
        tx: 26.0
        ty: 26.0
        tz: 26.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: dron_2_a_x_menos_8
    type: move
    mode: sequential
    goals:
      - drone_id: 2
        tipo_trayectoria: 0
        target: [-8.0, -9.0, 1.3]
        yaw_deg: 90.0
        tx: 26.0
        ty: 26.0
        tz: 26.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: espera_publicacion_izquierda
    type: wait
    seconds: 6.0

  - name: dron_1_vuelve_al_fiducial_2
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [0.0, -9.0, 1.0]
        yaw_deg: 90.0
        tx: 26.0
        ty: 26.0
        tz: 26.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: dron_2_vuelve_al_fiducial_2
    type: move
    mode: sequential
    goals:
      - drone_id: 2
        tipo_trayectoria: 0
        target: [0.0, -9.0, 1.3]
        yaw_deg: 90.0
        tx: 26.0
        ty: 26.0
        tz: 26.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: espera_snapshot_y_publicacion_final
    type: wait
    seconds: 26.0
