name: prueba_tipica_rodeo_edificio_dos_fiduciales
description: "Prueba tipica larga: dos drones rodean la casa en sentidos opuestos pasando por fiducial 2, fiducial 1 y vuelta a fiducial 2."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_spawn_fiduciales
    type: wait_for_bool
    topic: /fiducial_spawn_ready
    expected: true
    timeout_sec: 90.0

  - name: espera_arranque_tracking
    type: wait
    seconds: 16.0

  - name: ambos_al_fiducial_2
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.3]
        yaw_deg: 90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: espera_anclaje_fiducial_2
    type: wait
    seconds: 8.0

  - {name: abre_frontera_orb_dron_1_fiducial_2, type: call_set_bool, service: /dron_1/control/set_trajectory_active, value: false, timeout_sec: 20.0}
  - {name: abre_frontera_orb_dron_2_fiducial_2, type: call_set_bool, service: /dron_2/control/set_trajectory_active, value: false, timeout_sec: 20.0}
  - {name: activa_orb_dron_1_fiducial_2, type: call_set_bool, service: /dron_1/control/activate_orb_shadow, value: true, timeout_sec: 20.0}
  - {name: activa_orb_dron_2_fiducial_2, type: call_set_bool, service: /dron_2/control/activate_orb_shadow, value: true, timeout_sec: 20.0}
  - {name: confirma_orb_dron_1_fiducial_2, type: wait_for_bool, topic: /dron_1/control/orb_authority_confirmed, expected: true, timeout_sec: 20.0}
  - {name: confirma_orb_dron_2_fiducial_2, type: wait_for_bool, topic: /dron_2/control/orb_authority_confirmed, expected: true, timeout_sec: 20.0}

  - name: ambos_a_esquinas_sur_opuestas
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-10.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [10.0, -10.0, 1.3]
        yaw_deg: 90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: ambos_a_puntos_medios_laterales_subida
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-10.0, 0.0, 1.0]
        yaw_deg: 0.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [10.0, 0.0, 1.3]
        yaw_deg: 90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: false
        timeout_sec: 300.0

  - name: ambos_a_esquinas_norte_opuestas
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-10.0, 10.0, 1.0]
        yaw_deg: 0.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [10.0, 10.0, 1.3]
        yaw_deg: 0.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: false
        timeout_sec: 300.0

  - name: ambos_al_fiducial_1
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [0.0, 10.0, 1.0]
        yaw_deg: -90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [0.0, 10.0, 1.3]
        yaw_deg: 90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: false
        timeout_sec: 300.0

  - name: espera_anclaje_fiducial_1
    type: wait
    seconds: 8.0

  - {name: abre_frontera_orb_dron_1_fiducial_1, type: call_set_bool, service: /dron_1/control/set_trajectory_active, value: false, timeout_sec: 20.0}
  - {name: abre_frontera_orb_dron_2_fiducial_1, type: call_set_bool, service: /dron_2/control/set_trajectory_active, value: false, timeout_sec: 20.0}
  - {name: reactiva_orb_dron_1_fiducial_1, type: call_set_bool, service: /dron_1/control/activate_orb_shadow, value: true, timeout_sec: 20.0}
  - {name: reactiva_orb_dron_2_fiducial_1, type: call_set_bool, service: /dron_2/control/activate_orb_shadow, value: true, timeout_sec: 20.0}

  - name: barrido_fiducial_1_lateral_a
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [-1.0, 10.0, 1.0]
        yaw_deg: -90.0
        tx: 8.0
        ty: 8.0
        tz: 8.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 120.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [1.0, 10.0, 1.3]
        yaw_deg: -90.0
        tx: 8.0
        ty: 8.0
        tz: 8.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 120.0

  - name: barrido_fiducial_1_lateral_b
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [1.0, 10.0, 1.0]
        yaw_deg: -90.0
        tx: 8.0
        ty: 8.0
        tz: 8.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 120.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [-1.0, 10.0, 1.3]
        yaw_deg: -90.0
        tx: 8.0
        ty: 8.0
        tz: 8.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 120.0

  - name: espera_keyframes_fiducial_1
    type: wait
    seconds: 8.0

  - name: ambos_cruzan_lados_norte
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [10.0, 10.0, 1.0]
        yaw_deg: -90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [-10.0, 10.0, 1.3]
        yaw_deg: -90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: ambos_a_puntos_medios_laterales_bajada
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [10.0, 0.0, 1.0]
        yaw_deg: -90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: false
        timeout_sec: 300.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [-10.0, 0.0, 1.3]
        yaw_deg: 0.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: ambos_cruzan_lados_sur
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [10.0, -10.0, 1.0]
        yaw_deg: 0.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: false
        timeout_sec: 300.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [-10.0, -10.0, 1.3]
        yaw_deg: 0.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: ambos_vuelven_al_fiducial_2
    type: move
    mode: simultaneous
    goals:
      - drone_id: 1
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: -90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: false
        timeout_sec: 300.0
      - drone_id: 2
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.3]
        yaw_deg: 90.0
        tx: 40.0
        ty: 40.0
        tz: 40.0
        tyaw: 13.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 300.0

  - name: espera_snapshot_y_publicacion_final
    type: wait
    seconds: 30.0
