name: selector_f5_orb_frente_fiducial
description: "Selector F5 en ORB estricto: dron delante del fiducial y sin fallback GT."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 120.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: espera_tracking_y_fiducial, type: wait, seconds: 20.0}
  - {name: confirma_autoridad_orb, type: wait_for_bool, topic: /dron_1/control/orb_authority_confirmed, expected: true, timeout_sec: 30.0}
  - {name: hover_frente_fiducial, type: move, mode: sequential, goals: [{drone_id: 1, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 8.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}]}
  - {name: observacion_orb, type: wait, seconds: 20.0}
