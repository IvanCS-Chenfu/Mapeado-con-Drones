name: fase_6N_coverage_largo_d1_gt_depth
description: >-
  Observacion prolongada: D1 llega con GT al fiducial 2 y realiza coverage
  automatico hacia UNKNOWN con evidencia depth reversible FREE/OCCUPIED activa.
  La simulacion se mantiene abierta para revision humana.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 900.0
steps:
  - name: espera_registro_y_mapa
    type: wait
    seconds: 22.0
  - name: anclaje_fiducial_2_d1_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 12.0
        tyaw: 6.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: observacion_larga_coverage_depth_d1
    type: wait
    seconds: 600.0
