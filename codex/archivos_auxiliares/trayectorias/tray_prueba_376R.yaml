name: fase_7_bloque_1_backend_headless_repeticion
description: "Repeticion corregida de dos drones con backend y Gazebo, sin GUI F7."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 90.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: espera_arranque_drones, type: wait, seconds: 12.0}
  - name: desplazamiento_dos_drones
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [-1.0, -10.0, 1.0], yaw_deg: 90.0, tx: 8.0, ty: 8.0, tz: 8.0, tyaw: 6.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true, navigation_source: GT}
      - {drone_id: 2, tipo_trayectoria: 0, target: [1.0, -10.0, 1.0], yaw_deg: 90.0, tx: 8.0, ty: 8.0, tz: 8.0, tyaw: 6.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true, navigation_source: GT}
  - {name: observacion_final, type: wait, seconds: 8.0}
