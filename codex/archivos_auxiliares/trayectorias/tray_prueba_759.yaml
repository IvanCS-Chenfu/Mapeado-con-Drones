name: fase_6L_riesgo_visual_60_d1_observacion_manual
description: >-
  D1/GT se ancla al fiducial 2 y ejecuta la tarea de fachada con
  visual_risk_empty_region_fraction=0.60 para observacion manual prolongada.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 420.0
steps:
  - name: espera_minima_registro
    type: wait
    seconds: 2.0
  - name: anclaje_fiducial_2_d1_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 10.0
        ty: 10.0
        tz: 8.0
        tyaw: 5.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: observacion_manual_riesgo_visual_60
    type: wait
    seconds: 300.0
