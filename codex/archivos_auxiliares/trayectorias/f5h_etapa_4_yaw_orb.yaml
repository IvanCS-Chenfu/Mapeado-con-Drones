name: f5h_etapa_4_yaw_orb
description: "F5H etapa 4: yaw lento y rapido aislados bajo ORB."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 120.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: espera_tracking, type: wait, seconds: 16.0}
  - name: llegada_gt_fiducial_2
    type: move
    mode: sequential
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 8.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - {name: espera_anchor, type: wait, seconds: 8.0}
  - name: yaw_lento_orb
    type: move
    mode: sequential
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 45.0, tx: 8.0, ty: 8.0, tz: 8.0, tyaw: 12.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: false}
  - {name: pausa_yaw, type: wait, seconds: 3.0}
  - name: yaw_rapido_orb
    type: move
    mode: sequential
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 45.0, tx: 8.0, ty: 8.0, tz: 8.0, tyaw: 4.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: false}
  - {name: observacion_final, type: wait, seconds: 8.0}
