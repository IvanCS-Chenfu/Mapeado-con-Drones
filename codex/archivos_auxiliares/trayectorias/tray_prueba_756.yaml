name: fase_6N_aproximacion_incremental_unknown_d1
description: >-
  Valida que D1/GT se ancla en el fiducial 2, integra depth, aproxima con D*
  al primer voxel UNKNOWN y vuelve a seleccionar el siguiente objetivo.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 330.0
steps:
  - name: espera_minima_registro
    type: wait
    seconds: 2.0
  - name: anclaje_fiducial_2_d1_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 10.0
        ty: 10.0
        tz: 8.0
        tyaw: 5.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: observacion_aproximacion_unknown
    type: wait
    seconds: 90.0
