name: comprobacion_rapida_pitch_local_gt_d1
description: "D1 llega al fiducial 2 con GT y, sin traslacion adicional, ordena pitch local -25 grados para confirmar el joint de camara."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 120.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: espera_registro, type: wait, seconds: 15.0}
  - {name: llegada_gt_fiducial_2, type: move, mode: sequential, goals: [{drone_id: 1, navigation_source: GT, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 6.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}]}
  - {name: confirma_llegada, type: wait_for_navigation_pose, drone_id: 1, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, position_tolerance_m: 0.15, yaw_tolerance_deg: 3.0, hold_sec: 0.5, timeout_sec: 15.0}
  - {name: pitch_local_menos_25, type: pitch, drone_id: 1, target_deg: -25.0, tolerance_deg: 1.0, timeout_sec: 15.0}
  - {name: observacion_pitch, type: wait, seconds: 12.0}
