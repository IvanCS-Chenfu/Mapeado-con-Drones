name: fase_3R_score_mappoints_aislados_gui_estricto
description: >-
  Repite la prueba 764 con el soporte espacial 3R endurecido a dos vecinos
  validos dentro de 0.40 m; D1/GT al fiducial 2 sin Fase 6.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 180.0
steps:
  - name: espera_registro
    type: wait
    seconds: 2.0
  - name: anclaje_fiducial_2_d1_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 10.0
        ty: 10.0
        tz: 8.0
        tyaw: 5.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
  - name: observacion_scores_aislados_estricta
    type: wait
    seconds: 90.0
