name: f1_documentacion_video
description: "F1 documental: un dron sigue una trayectoria GT corta mientras se observa GT frente a Tray."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 90.0
steps:
  - name: espera_arranque_simulacion
    type: wait
    seconds: 6.0

  - name: preparacion_captura_visual
    type: wait
    seconds: 25.0

  - name: despegue_estable_dron_1
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, 0.0, 1.4]
        yaw_deg: 0.0
        tx: 5.0
        ty: 5.0
        tz: 5.0
        tyaw: 4.0
        absoluto_x: false
        absoluto_y: false
        absoluto_z: false
        absoluto_yaw: false

  - name: desplazamiento_diagonal_dron_1
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [1.5, 1.5, 0.3]
        yaw_deg: 45.0
        tx: 8.0
        ty: 8.0
        tz: 6.0
        tyaw: 6.0
        absoluto_x: false
        absoluto_y: false
        absoluto_z: false
        absoluto_yaw: false

  - name: observacion_final
    type: wait
    seconds: 4.0
