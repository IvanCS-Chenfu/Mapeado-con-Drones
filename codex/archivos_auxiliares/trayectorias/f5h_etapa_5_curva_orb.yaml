name: f5h_etapa_5_curva_orb
description: "F5H etapa 5: trayectoria simple con dos curvas bajo ORB."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 120.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: espera_tracking, type: wait, seconds: 16.0}
  - name: llegada_gt_fiducial_2
    type: move
    mode: sequential
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 8.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - {name: espera_anchor, type: wait, seconds: 8.0}
  - name: tramo_1_orb
    type: move
    mode: sequential
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [-4.0, -10.0, 1.0], yaw_deg: 90.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 8.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - name: curva_1_orb
    type: move
    mode: sequential
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [-4.0, -6.0, 1.0], yaw_deg: 0.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 8.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - name: curva_2_orb
    type: move
    mode: sequential
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [0.0, -6.0, 1.0], yaw_deg: 0.0, tx: 12.0, ty: 12.0, tz: 12.0, tyaw: 8.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - {name: observacion_final, type: wait, seconds: 8.0}
