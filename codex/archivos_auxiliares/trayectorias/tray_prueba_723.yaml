name: fase_6N_depth_por_keyframe_gt_d1
description: "D1 llega con GT al fiducial 2, espera el anclaje y deja procesar observaciones depth por KeyFrame; no activa STOP depth para aislar la evidencia voxel."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 180.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: espera_registro, type: wait, seconds: 22.0}
  - name: anclaje_gt_fiducial_2_d1
    type: move
    mode: sequential
    goals:
      - {drone_id: 1, navigation_source: GT, retry_on_rejected: true, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 16.0, ty: 16.0, tz: 12.0, tyaw: 6.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true}
  - {name: confirma_llegada_fiducial_2, type: wait_for_navigation_pose, drone_id: 1, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, position_tolerance_m: 0.15, yaw_tolerance_deg: 3.0, hold_sec: 1.0, timeout_sec: 24.0}
  - {name: espera_anclaje_y_depth, type: wait, seconds: 30.0}
