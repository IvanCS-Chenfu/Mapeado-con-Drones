name: f5h_351_visual_evidence_dos_fachadas_shadow
description: "F5H 351: ruta 349 de dos fachadas con GT gobernando y ORB en shadow."
namespace_base: dron
action_name: AccionTrayectoria
defaults: {timeout_sec: 300.0}
steps:
  - {name: espera_spawn, type: wait_for_bool, topic: /fiducial_spawn_ready, expected: true, timeout_sec: 90.0}
  - {name: espera_tracking, type: wait, seconds: 16.0}
  - name: ambos_al_fiducial_2
    type: move
    mode: simultaneous
    goals:
      - {drone_id: 1, tipo_trayectoria: 0, target: [0.0, -10.0, 1.0], yaw_deg: 90.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true, timeout_sec: 300.0}
      - {drone_id: 2, tipo_trayectoria: 0, target: [0.0, -10.0, 1.3], yaw_deg: 90.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true, timeout_sec: 300.0}
  - {name: espera_anclaje, type: wait, seconds: 8.0}
  - name: dron_2_esquina_sur_este_gt
    type: move
    mode: sequential
    goals:
      - {drone_id: 2, tipo_trayectoria: 0, target: [10.0, -10.0, 1.3], yaw_deg: 90.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: true, timeout_sec: 300.0}
  - name: dron_2_fachada_este_media_gt
    type: move
    mode: sequential
    goals:
      - {drone_id: 2, tipo_trayectoria: 0, target: [10.0, 0.0, 1.3], yaw_deg: 90.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: false, timeout_sec: 300.0}
  - name: dron_2_esquina_norte_este_gt
    type: move
    mode: sequential
    goals:
      - {drone_id: 2, tipo_trayectoria: 0, target: [10.0, 10.0, 1.3], yaw_deg: 0.0, tx: 40.0, ty: 40.0, tz: 40.0, tyaw: 13.0, absoluto_x: true, absoluto_y: true, absoluto_z: true, absoluto_yaw: false, timeout_sec: 300.0}
  - {name: hover_final, type: wait, seconds: 12.0}
