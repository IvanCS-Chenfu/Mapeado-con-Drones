name: c7_7_2_tracking_risk_gt_bootstrap_managed_yaw
summary: Arranque GT estable, anclaje fiducial, autoridad ORB efectiva y giro normal
  90 a 0 grados gestionado por task_manager y cancelable por TRACKING_RISK.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
- name: espera_spawn_fiduciales
  type: wait_for_bool
  topic: /fiducial_spawn_ready
  expected: true
  timeout_sec: 90.0
- name: espera_arranque_orb
  type: wait
  seconds: 22.0
- name: traslacion_gt_anclaje_fiducial_2
  type: move
  mode: sequential
  goals:
  - drone_id: 1
    navigation_source: GT
    tipo_trayectoria: 0
    target:
    - 0.0
    - -10.0
    - 1.0
    yaw_deg: 90.0
    tx: 16.0
    ty: 16.0
    tz: 12.0
    tyaw: 6.0
    absoluto_x: true
    absoluto_y: true
    absoluto_z: true
    absoluto_yaw: true
    timeout_sec: 180.0
- name: confirma_pose_fiducial_2
  type: wait_for_navigation_pose
  drone_id: 1
  target:
  - 0.0
  - -10.0
  - 1.0
  yaw_deg: 90.0
  position_tolerance_m: 0.2
  yaw_tolerance_deg: 4.0
  hold_sec: 1.0
  timeout_sec: 30.0
- name: solicita_fuente_orb
  type: call_trigger
  service: /dron_1/control/set_navigation_source_orb
  timeout_sec: 20.0
- name: espera_autoridad_orb
  type: wait_for_bool
  topic: /dron_1/control/orb_authority_confirmed
  expected: true
  timeout_sec: 90.0
- name: giro_orb_normal_90_a_0_con_riesgo
  type: managed_yaw
  drone_id: 1
  mission_id: chapter7_tracking_risk_orb
  target:
  - 0.0
  - -10.0
  - 1.0
  yaw_deg: 0.0
  duration_sec: 24.0
  timeout_sec: 90.0
  visual_recovery_timeout_sec: 45.0
