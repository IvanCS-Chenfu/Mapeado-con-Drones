name: c7_8_1_orb_short_cubic
summary: Aproximacion GT al fiducial 2, autoridad ORB y tramo corto cubico de 7 m.
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 240.0
steps:
- name: espera_spawn_fiduciales
  type: wait_for_bool
  topic: /fiducial_spawn_ready
  expected: true
  timeout_sec: 90.0
- name: espera_arranque_orb
  type: wait
  seconds: 22.0
- name: aproximacion_gt_fiducial_2
  type: move
  mode: sequential
  goals:
  - drone_id: 1
    navigation_source: GT
    tipo_trayectoria: 0
    target: [0.0, -10.0, 1.0]
    yaw_deg: 90.0
    tx: 18.0
    ty: 12.0
    tz: 12.0
    tyaw: 6.0
    absoluto_x: true
    absoluto_y: true
    absoluto_z: true
    absoluto_yaw: true
    timeout_sec: 180.0
- name: confirma_pose_anclaje
  type: wait_for_navigation_pose
  drone_id: 1
  target: [0.0, -10.0, 1.0]
  yaw_deg: 90.0
  position_tolerance_m: 0.20
  yaw_tolerance_deg: 4.0
  hold_sec: 1.0
  timeout_sec: 30.0
- name: solicita_fuente_orb
  type: call_trigger
  service: /dron_1/control/set_navigation_source_orb
  timeout_sec: 20.0
- name: abre_frontera_orb
  type: call_set_bool
  service: /dron_1/control/set_trajectory_active
  value: false
  timeout_sec: 20.0
- name: espera_autoridad_orb
  type: wait_for_bool
  topic: /dron_1/control/orb_authority_confirmed
  expected: true
  timeout_sec: 90.0
- name: tramo_orb_cubico_7m
  type: move
  mode: sequential
  goals:
  - drone_id: 1
    navigation_source: ORB
    tipo_trayectoria: 0
    target: [-7.0, -10.0, 1.0]
    yaw_deg: 90.0
    tx: 24.0
    ty: 8.0
    tz: 8.0
    tyaw: 6.0
    absoluto_x: true
    absoluto_y: true
    absoluto_z: true
    absoluto_yaw: true
    timeout_sec: 180.0
- name: confirma_destino_orb
  type: wait_for_navigation_pose
  drone_id: 1
  target: [-7.0, -10.0, 1.0]
  yaw_deg: 90.0
  position_tolerance_m: 0.30
  yaw_tolerance_deg: 5.0
  hold_sec: 1.0
  timeout_sec: 45.0
