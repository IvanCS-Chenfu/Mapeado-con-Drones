name: autonomous_gt_voxel_sparse_8_3
mission_mode: autonomous
navigation_source: gt
autonomous_handoff: false
description: "D1 genera evidencia sparse antes y despues del anclaje sin abrir tareas autonomas."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_spawn_fiduciales
    type: wait_for_bool
    topic: /fiducial_spawn_ready
    expected: true
    timeout_sec: 90.0

  - name: espera_arranque_tracking
    type: wait
    seconds: 16.0

  - name: tramo_a_fiducial_2_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 28.0
        ty: 28.0
        tz: 28.0
        tyaw: 10.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: espera_anclaje_y_materializacion_sparse
    type: wait
    seconds: 18.0

  - name: tramo_posterior_a_x_10_gt
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [10.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 32.0
        ty: 32.0
        tz: 32.0
        tyaw: 10.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: espera_materializacion_tramo_final
    type: wait
    seconds: 18.0
