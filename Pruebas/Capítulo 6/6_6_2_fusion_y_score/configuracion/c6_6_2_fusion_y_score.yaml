name: c6_6_2_fusion_y_score
description: "Un dron GT alterna entre las fachadas sur y oeste elevando Z 0.3 m en cada pasada para observar fusion y score."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_spawn_fiduciales
    type: wait_for_bool
    topic: /fiducial_spawn_ready
    expected: true
    timeout_sec: 90.0

  - name: espera_arranque_tracking
    type: wait
    seconds: 16.0

  - name: llegada_fiducial_sur
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 16.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 180.0

  - name: pasada_1_oeste
    type: move
    mode: sequential
    goals:
      - &pasada_oeste
        drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-10.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 24.0
        ty: 24.0
        tz: 24.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: pasada_2_sur
    type: move
    mode: sequential
    goals:
      - &pasada_sur
        drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.3]
        yaw_deg: 90.0
        tx: 24.0
        ty: 24.0
        tz: 24.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: pasada_3_oeste
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-10.0, -10.0, 1.6]
        yaw_deg: 90.0
        tx: 24.0
        ty: 24.0
        tz: 24.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: pasada_4_sur
