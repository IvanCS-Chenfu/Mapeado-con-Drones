name: c6_4_1_anclaje_por_loop
description: "D1 anclado por fiducial; D2 comparte la fachada oeste, se ancla por loop y luego recibe un fiducial absoluto."
namespace_base: dron
action_name: AccionTrayectoria
defaults:
  timeout_sec: 300.0
steps:
  - name: espera_spawn_fiduciales
    type: wait_for_bool
    topic: /fiducial_spawn_ready
    expected: true
    timeout_sec: 90.0

  - name: espera_arranque_tracking
    type: wait
    seconds: 16.0

  - name: d1_llegada_fiducial_sur
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 16.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 180.0

  - name: d1_borde_sur_hacia_oeste
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-10.0, -10.0, 1.0]
        yaw_deg: 90.0
        tx: 24.0
        ty: 24.0
        tz: 24.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: d1_lateral_oeste_compartido
    type: move
    mode: sequential
    goals:
      - drone_id: 1
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-10.0, 0.0, 1.0]
        yaw_deg: 0.0
        tx: 24.0
        ty: 24.0
        tz: 24.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: espera_mapa_d1_anclado
    type: wait
    seconds: 25.0

  - name: d2_inicio_oeste_sin_fiducial
    type: move
    mode: sequential
    goals:
      - drone_id: 2
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-10.0, -10.0, 1.3]
        yaw_deg: 90.0
        tx: 16.0
        ty: 16.0
        tz: 16.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 180.0

  - name: d2_region_compartida_para_loop
    type: move
    mode: sequential
    goals:
      - drone_id: 2
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-10.0, 0.0, 1.3]
        yaw_deg: 0.0
        tx: 24.0
        ty: 24.0
        tz: 24.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: espera_anclaje_loop_d2
    type: wait
    seconds: 30.0

  - name: d2_lateral_norte
    type: move
    mode: sequential
    goals:
      - drone_id: 2
        navigation_source: GT
        tipo_trayectoria: 0
        target: [-10.0, 10.0, 1.3]
        yaw_deg: 0.0
        tx: 24.0
        ty: 24.0
        tz: 24.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: d2_fiducial_norte_reanclaje
    type: move
    mode: sequential
    goals:
      - drone_id: 2
        navigation_source: GT
        tipo_trayectoria: 0
        target: [0.0, 10.0, 1.3]
        yaw_deg: -90.0
        tx: 24.0
        ty: 24.0
        tz: 24.0
        tyaw: 8.0
        absoluto_x: true
        absoluto_y: true
        absoluto_z: true
        absoluto_yaw: true
        timeout_sec: 240.0

  - name: espera_reanclaje_y_capturas
    type: wait
    seconds: 45.0
